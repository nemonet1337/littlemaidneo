# NeoForge Minecraft mod (Gradle + Java)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    ignore:
      # NeoForge / Minecraft が strictly 固定。単独バンプは compileClasspath が解決不能になる。
      - dependency-name: "org.ow2.asm:*"
      - dependency-name: "commons-io:commons-io"
    groups:
      neoforge:
        patterns:
          - "net.neoforged*"
          - "neoforge*"
        update-types:
          - minor
          - patch
      gradle-plugins:
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
